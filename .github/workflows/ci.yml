name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:

  ci:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check cgroup version
        run: |
          echo "Filesystem type of /sys/fs/cgroup:"
          stat -fc %T /sys/fs/cgroup
  
          echo "Contents of /sys/fs/cgroup:"
          ls -l /sys/fs/cgroup
          
      - name: Debug cgroup capabilities
        run: |
          ls -l /sys/fs/cgroup/
          cat /proc/self/cgroup
          capsh --print

      - name: Install dependencies
        run: sudo apt-get install -y libcap-dev util-linux

      - name: Build
        run: |
          make CXX=g++-9 ECHO=echo OMEGAJAIL_RELEASE=${{ github.sha }} all
          cargo build --bins
          cargo build --tests

      - name: Test
        run: timeout 5m make test || echo "Tests timed out, continuing..."

      - name: Build rootfs
        run: make OMEGAJAIL_RELEASE=${{ github.sha }} rootfs

      - name: Smoketest
        run: |
          # cgroup v2 path
          CGROUP_PATH="/sys/fs/cgroup/omegaup-runner.service-omegajail.scope"

          # create the cgroup directory
          sudo mkdir -p "$CGROUP_PATH"
          sudo chown $(whoami) "$CGROUP_PATH"
          sudo chgrp $(whoami) "$CGROUP_PATH"

          # run test pointing to new path
          taskset 0x1 ./smoketest/test \
            --root=./rootfs \
            --strace \
            --cgroup-path=/omegaup-runner.service-omegajail.scope

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: smoketest/run/

  smoketest-docker:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build container
        run: |
          make OMEGAJAIL_RELEASE=${{ github.sha }} .omegajail-builder-rootfs-runtime.stamp

      - name: Smoketest (Docker)
        run: |
          make OMEGAJAIL_RELEASE=${{ github.sha }} smoketest-docker

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-docker
          path: smoketest/run/
