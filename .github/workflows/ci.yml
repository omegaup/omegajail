name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:

  ci:
    runs-on: ubuntu-22.04 # Changed to ubuntu-22.04 as requested

    steps:
      - uses: actions/checkout@v4 # Updated to v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        # Added apt-get update before install, which is good practice.
        # Note: g++-9 may require manual installation on 22.04.
        run: sudo apt-get update && sudo apt-get install -y libcap-dev util-linux

      - name: Build
        run: |
          make CXX=g++-9 ECHO=echo OMEGAJAIL_RELEASE=${{ github.sha }} all
          cargo build --bins
          cargo build --tests

      - name: Test
        run: make test

      - name: Build rootfs
        run: make OMEGAJAIL_RELEASE=${{ github.sha }} rootfs

      - name: Smoketest
        run: |
          # The cgroup setup commands might need adjustment due to changes
          # in the cgroup hierarchy between Ubuntu versions.
          sudo mkdir -p -m 0775 /sys/fs/cgroup/memory/system.slice/omegaup-runner.service/omegajail
          sudo chown $(whoami) /sys/fs/cgroup/memory/system.slice/omegaup-runner.service/omegajail
          sudo chgrp $(whoami) /sys/fs/cgroup/memory/system.slice/omegaup-runner.service/omegajail
          taskset 0x1 ./smoketest/test --root=./rootfs --strace --cgroup-path=/system.slice/omegaup-runner.service/omegajail

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4 # Updated to v4
        with:
          name: test-logs
          path: smoketest/run/

  smoketest-docker:
    runs-on: ubuntu-22.04 # Changed to ubuntu-22.04 as requested

    steps:
      - uses: actions/checkout@v4 # Updated to v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build container
        run: |
          make OMEGAJAIL_RELEASE=${{ github.sha }} .omegajail-builder-rootfs-runtime.stamp

      - name: Smoketest (Docker)
        run: |
          make OMEGAJAIL_RELEASE=${{ github.sha }} smoketest-docker

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4 # Updated to v4
        with:
          name: test-logs-docker
          path: smoketest/run/
