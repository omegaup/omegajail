name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:

  ci:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get install -y libcap-dev util-linux

      - name: Build
        run: |
          make CXX=g++-11 ECHO=echo OMEGAJAIL_RELEASE=${{ github.sha }} all
          cargo build --bins
          cargo build --tests

      - name: Test
        run: make test

      - name: Build rootfs
        run: make OMEGAJAIL_RELEASE=${{ github.sha }} rootfs

      - name: Smoketest
        run: |
          # Configure cgroups (v2 or v1 depending on availability)
          if [ -d "/sys/fs/cgroup/cgroup.controllers" ]; then
            # Configuration for cgroups v2
            sudo mkdir -p /sys/fs/cgroup/omegajail
            echo "+memory +pids +cpu" | sudo tee /sys/fs/cgroup/cgroup.subtree_control || true
            sudo chown -R $(whoami) /sys/fs/cgroup/omegajail
            ./smoketest/test --root=./rootfs --cgroup-path=/omegajail
          else
            # Legacy configuration for cgroups v1
            sudo mkdir -p -m 0775 /sys/fs/cgroup/memory/system.slice/omegaup-runner.service/omegajail
            sudo chown $(whoami) /sys/fs/cgroup/memory/system.slice/omegaup-runner.service/omegajail
            sudo chgrp $(whoami) /sys/fs/cgroup/memory/system.slice/omegaup-runner.service/omegajail
            taskset 0x1 ./smoketest/test --root=./rootfs --strace --cgroup-path=/system.slice/omegaup-runner.service/omegajail
          fi

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: smoketest/run/

  smoketest-docker:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build container
        run: |
          make OMEGAJAIL_RELEASE=${{ github.sha }} .omegajail-builder-rootfs-runtime.stamp

      - name: Smoketest (Docker)
        run: |
          make OMEGAJAIL_RELEASE=${{ github.sha }} smoketest-docker

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-docker
          path: smoketest/run/
