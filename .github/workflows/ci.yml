name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:

  ci-in-vm: # Renamed job to indicate it runs in a VM
    runs-on: ubuntu-22.04 # Host runner remains on a supported version (22.04)

    steps:
      - uses: actions/checkout@v4 # Updated to latest version
        with:
          submodules: recursive
          fetch-depth: 0

      # ----------------------------------------------------------------------
      # LIMA VM SETUP (AlmaLinux 8 Guest)
      # ----------------------------------------------------------------------
      - name: Setup Lima VM
        uses: lima-vm/lima-actions/setup@v1
        id: lima-actions-setup

      - name: Cache Lima VM
        uses: actions/cache@v4 # Updated to latest version
        with:
          path: ~/.cache/lima
          # --- UPDATED: Cache key now uses almalinux-8 ---
          key: lima-almalinux-8-${{ steps.lima-actions-setup.outputs.version }}

      - name: Start Lima VM (AlmaLinux 8, cgroups v1)
        run: |
          # --- UPDATED: Use the template://almalinux-8 ---
          limactl start --name=omegajail-vm --cpus=2 --memory=4 --containerd=none template://almalinux-8

      - name: Copy repo into VM
        run: |
          # 1. Create the writable directory inside the VM
          limactl shell omegajail-vm -- mkdir -p /tmp/omegajail
          
          # 2. Copy the contents of the *current host directory* to the *VM directory*
          # Using the tarball method for reliable transfer
          tar czf - . | limactl shell omegajail-vm -- tar xzf - -C /tmp/omegajail

      # ----------------------------------------------------------------------
      # RUN CI INSIDE ALMALINUX 8 VM
      # ----------------------------------------------------------------------
      - name: Run CI inside AlmaLinux 8 VM
        run: |
          # Use limactl shell to execute all build/test commands inside the VM
          limactl shell omegajail-vm -- bash -c '
            cd /tmp/omegajail &&

            # --- UPDATED: Install dependencies using dnf/yum (for AlmaLinux) ---
            sudo dnf update -y &&
            sudo dnf install -y libcap-devel util-linux gcc-toolset-9 make cargo glibc-devel libstdc++-devel &&
            
            # NOTE: gcc-toolset-9 provides g++-9, which is needed by omegajail.
            # We explicitly use it here to ensure the correct compiler version is picked up.
            source /opt/rh/gcc-toolset-9/enable &&

            # Build steps
            # --- UPDATED: Explicitly call g++ from the toolset ---
            make CXX=/opt/rh/gcc-toolset-9/root/usr/bin/g++ ECHO=echo OMEGAJAIL_RELEASE=${GITHUB_SHA} all &&
            cargo build --bins &&
            cargo build --tests &&

            # Test steps
            make test &&
            make OMEGAJAIL_RELEASE=${GITHUB_SHA} rootfs &&

            # Smoketest (cgroups v1 setup)
            # This is the original cgroups v1 setup, often more reliable on RHEL-based systems like Alma
            sudo mkdir -p -m 0775 /sys/fs/cgroup/memory/system.slice/omegaup-runner.service/omegajail &&
            sudo chown $(whoami) /sys/fs/cgroup/memory/system.slice/omegaup-runner.service/omegajail &&
            sudo chgrp $(whoami) /sys/fs/cgroup/memory/system.slice/omegaup-runner.service/omegajail &&
            taskset 0x1 ./smoketest/test --root=./rootfs --strace --cgroup-path=/system.slice/omegaup-runner.service/omegajail
          '

      # ----------------------------------------------------------------------
      # ARTIFACT RETRIEVAL AND UPLOAD (Unchanged)
      # ----------------------------------------------------------------------
      - name: Retrieve artifacts from VM
        run: |
          # Package test logs from the /tmp location and copy them back to the host runner
          limactl shell omegajail-vm -- tar czf /tmp/artifacts.tar.gz -C /tmp/omegajail smoketest/run
          limactl copy omegajail-vm:/tmp/artifacts.tar.gz .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4 # Updated to latest version
        with:
          name: test-logs
          path: artifacts.tar.gz

  # The Docker smoketest job is kept separate as it might not need Lima
  smoketest-docker:
    runs-on: ubuntu-22.04 # Host runner remains on a supported version

    steps:
      - uses: actions/checkout@v4 # Updated to latest version
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build container
        run: |
          make OMEGAJAIL_RELEASE=${{ github.sha }} .omegajail-builder-rootfs-runtime.stamp

      - name: Smoketest (Docker)
        run: |
          make OMEGAJAIL_RELEASE=${{ github.sha }} smoketest-docker

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4 # Updated to latest version
        with:
          name: test-logs-docker
          path: smoketest/run/
