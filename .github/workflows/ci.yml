name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  smoketest-docker:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-dev util-linux mono-complete

      - name: Build
        run: |
          make CXX=g++-11 ECHO=echo OMEGAJAIL_RELEASE=${{ github.sha }} all
          cargo build --bins

      - name: Build container
        run: |
          # First build the distribution image
          make OMEGAJAIL_RELEASE=${{ github.sha }} .omegajail-builder-distrib.stamp
          # Then build the runtime debug image
          make OMEGAJAIL_RELEASE=${{ github.sha }} .omegajail-builder-rootfs-runtime-debug.stamp

      - name: Rust tests in Docker
        run: |
          # Run Rust tests inside the Docker container
          docker run \
            --rm \
            --mount "type=bind,source=${{ github.workspace }},target=/omegajail" \
            --workdir "/omegajail" \
            --user "$(id -u):$(id -g)" \
            omegaup/omegajail-builder-rootfs-runtime-debug \
            bash -c "PATH=/opt/rust/cargo/bin:\$PATH cargo test"

      - name: Smoketest (Docker)
        run: |
          make OMEGAJAIL_RELEASE=${{ github.sha }} smoketest-docker

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-docker
          path: smoketest/run/
